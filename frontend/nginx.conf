server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # index.html — never cache (contains references to hashed assets)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # SPA fallback also serves index.html — prevent caching
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hashed assets from Vite build — cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
