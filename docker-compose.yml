x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

name: aqllify

services:
  backend:
    build: ./backend
    container_name: aqllify-backend
    restart: unless-stopped
    env_file: .env
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
      - '127.0.0.1:18000:8000'
    volumes:
      - ./courses:/courses:ro
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

  bot:
    build: ./backend
    container_name: aqllify-bot
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "src.bot"]
    security_opt:
      - no-new-privileges:true
    profiles:
      - bot
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

  frontend:
    build: ./frontend
    container_name: aqllify-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 32M
    ports:
      - '127.0.0.1:18001:80'
    networks:
      - internal
    logging: *default-logging

  landing:
    image: caddy:2-alpine
    container_name: aqllify-landing
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /home/devbox/aqllify-landing/site:/srv:ro
      - /home/devbox/aqllify-landing/caddy-config/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - '127.0.0.1:18002:80'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - internal
    logging: *default-logging

  db:
    image: postgres:17-alpine
    container_name: aqllify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tutor_password}
      POSTGRES_DB: tutor_db
    volumes:
      - aqllify-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d tutor_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - internal
    logging: *default-logging

volumes:
  aqllify-db-data:

networks:
  internal:
    driver: bridge
