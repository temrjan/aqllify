name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend — Lint + Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aqllify_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: aqllify_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aqllify_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql+asyncpg://aqllify_test:ci-test-only@localhost:5432/aqllify_test
      TEST_DATABASE_URL: postgresql+asyncpg://aqllify_test:ci-test-only@localhost:5432/aqllify_test
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Deployment script syntax
        run: bash -n ../ops/ci-entrypoint.sh ../ops/deploy.sh

      - name: Format check
        run: ruff format --check .

      - name: Prepare disposable databases
        run: |
          alembic upgrade head
          PGPASSWORD=ci-test-only psql -h localhost -U aqllify_test -d aqllify_test -c 'CREATE DATABASE aqllify_migration_test'

      - name: Tests
        env:
          TEST_MIGRATION_DATABASE_URL: postgresql+asyncpg://aqllify_test:ci-test-only@localhost:5432/aqllify_migration_test
        run: pytest tests/ -v --tb=short

  frontend:
    name: Frontend — Type Check + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Production
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: aqllify-production
      cancel-in-progress: false

    steps:
      - name: Deploy tested revision to devbox
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/aqllify_deploy
          chmod 600 ~/.ssh/aqllify_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -i ~/.ssh/aqllify_deploy -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" "deploy $GITHUB_SHA"
