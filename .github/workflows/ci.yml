name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Lint + Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aqllify_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: aqllify_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aqllify_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql+asyncpg://aqllify_test:ci-test-only@localhost:5432/aqllify_test
      TEST_DATABASE_URL: postgresql+asyncpg://aqllify_test:ci-test-only@localhost:5432/aqllify_test
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Prepare disposable databases
        run: |
          alembic upgrade head
          PGPASSWORD=ci-test-only psql -h localhost -U aqllify_test -d aqllify_test -c 'CREATE DATABASE aqllify_migration_test'

      - name: Tests
        env:
          TEST_MIGRATION_DATABASE_URL: postgresql+asyncpg://aqllify_test:ci-test-only@localhost:5432/aqllify_migration_test
        run: pytest tests/ -v --tb=short

  frontend:
    name: Frontend — Type Check + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Production
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /opt/aqllify
            git pull origin main
            docker compose build
            docker compose up -d
            docker compose exec -T backend alembic upgrade head
            sleep 5
            docker compose ps
            docker compose exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" || exit 1
